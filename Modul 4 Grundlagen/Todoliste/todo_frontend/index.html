<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body onload="loadTodos()">
    <h1>Todo-Liste</h1>
    <form
      onsubmit="
        addTodo();
        return false;
      "
    >
      <input type="text" placeholder="Neues Todo" id="todoinput" />
      <button>hinzufügen</button>
    </form>

    <ul id="todoList">
      <li>Laden ...</li>
    </ul>

    <script>
      let todos = [];

      async function loadTodos() {
        const url = "http://127.0.0.1:3000/todos";
        let resp = await fetch(url);
        todos = await resp.json();

        render();
      }

      function addTodo() {
        let todoText = document.getElementById("todoinput").value;

        todos.push({ "title": todoText });
        document.getElementById("todoinput").value = "";

        addToServer(todoText);
        render();
      }
      function addToServer(todoText) {
        fetch("http://127.0.0.1:3000/todos", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            title: todoText,
          }),
        });
      }

      function render() {
        todoList.innerHTML = "";
        todos.forEach(
          (todo) => (todoList.innerHTML += `<li>${todo.title}</li>`),
        );
      }
    </script>
  </body>
</html>
